model:
  name: "fpcd_siamese_v1"
  type: "siamese_unet"
  num_classes: 5
  encoder_name: "resnet18"
  pretrained: true
  fusion_type: "diff_cat" # Concatenate [feat_T0, feat_T1, |feat_T0 - feat_T1|]
  decoder_channels: [256, 128, 64, 32, 16]

dataset:
  name: "FPCD"
  dataset_id: "ctundia/FPCD"
  data_dir: "./data/fpcd"
  image_size: [256, 256]
  batch_size: 16
  num_workers: 0
  pin_memory: false
  pixel_resolution_m: 1.0 # 1 meter per pixel GSD

classes:
  0: "Background"
  1: "Farm Pond Constructed"
  2: "Farm Pond Demolished"
  3: "Farm Pond Dried"
  4: "Farm Pond Wetted"

training:
  epochs: 8
  learning_rate: 0.0005
  weight_decay: 0.0001
  loss_ce_weight: 0.5
  loss_dice_weight: 0.5
  class_weights: [0.15, 1.8, 2.2, 2.0, 1.8]
  seed: 42
  early_stopping_patience: 6
  save_dir: "./models"
  log_dir: "./experiments/siamese"
